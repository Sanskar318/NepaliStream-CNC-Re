name: Decode and Publish Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install jadx tool
        run: |
          sudo apt-get update
          sudo apt-get install -y jadx

      - name: Run decode sources script
        run: python scripts/decode_sources.py

      - name: Commit and push decoded changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add decoded/ decoded-index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-decode .cs3 files and update index" && git push)
